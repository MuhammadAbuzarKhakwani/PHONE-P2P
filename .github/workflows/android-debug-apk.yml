name: Debug APK

# Builds an installable APK with NO secrets and NO local toolchain.
#
# Go to Actions -> "Debug APK" -> "Run workflow". When it finishes, download the
# "wdcable-debug-apk" artifact and install it on both phones.
#
# Debug builds are signed with the standard Android debug key, so nothing needs
# to be configured. That also means these APKs are for testing only and must not
# be distributed.
#
# This project had never been compiled when the workflow was written, so every
# check runs even if an earlier one fails. That way a single run tells you
# everything that is wrong instead of only the first thing.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheap and dependency-free, so it runs first: it catches channel-key
      # mismatches and unterminated literals that the compilers never report.
      - name: Static checks
        id: static
        continue-on-error: true
        run: python tools/static_checks/run_all.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi

          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -n 1 || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail

          # The app bundles libopus through CMake/JNI, so the NDK is required.
          "$sdkmanager_bin" \
            "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Show build environment
        shell: bash
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter precache --android

      # Not blocking: this codebase had never been analysed, so the first run is
      # expected to report findings. Seeing them alongside the build result is
      # more useful than stopping here.
      - name: Analyze Dart
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Dart tests
        id: darttest
        continue-on-error: true
        run: flutter test

      - name: Kotlin unit tests
        id: kotlintest
        continue-on-error: true
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: ignore

      - name: Build debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wdcable-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WDCable debug build"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Static checks | ${{ steps.static.outcome }} |"
            echo "| flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| Dart tests | ${{ steps.darttest.outcome }} |"
            echo "| Kotlin unit tests | ${{ steps.kotlintest.outcome }} |"
            echo "| APK build | ${{ steps.apk.outcome }} |"
            echo
            if [[ "${{ steps.apk.outcome }}" == "success" ]]; then
              echo "Download the **wdcable-debug-apk** artifact below and install it on"
              echo "both phones, then follow \`QUICKSTART.md\`."
            else
              echo "The APK did not build. Open the **Build debug APK** step above for the"
              echo "compiler errors."
            fi
            echo
            echo "A non-success on analyze or tests does not block the APK, but should be"
            echo "read before trusting the build."
          } >> "$GITHUB_STEP_SUMMARY"
